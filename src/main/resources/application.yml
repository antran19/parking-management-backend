spring:
  application:
    name: smartparking-backend

  # ===== DATABASE =====
  datasource:
    url: jdbc:postgresql://localhost:5432/smartparking_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ===== REDIS =====
  data:
    redis:
      host: localhost
      port: 6380
      timeout: 2000ms
      # password: (để trống nếu dev local không có auth)

  # ===== FILE UPLOAD (nếu cần upload ảnh xe) =====
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

# ===== SERVER =====
server:
  port: 8080
  error:
    include-message: always

# ===== JWT =====
jwt:
  secret: "smartparking-super-secret-key-SU26SWP08-minimum-256-bits-change-in-prod"
  expiration: 3600000          # 1 hour (milliseconds)
  refresh-expiration: 604800000  # 7 days (milliseconds)

# ===== SMARTPARKING CONFIG =====
smartparking:
  reservation:
    hold-minutes: 30          # Giữ chỗ tối đa 30 phút
  overstay:
    alert-hours: 24           # Cảnh báo xe gửi quá 24 giờ
  slot-assignment:
    floor-weight: 100         # Trọng số ưu tiên tầng thấp
    distance-weight: 1        # Trọng số ưu tiên gần thang máy

# ===== VNPAY SANDBOX =====
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:2AS5E3Q3}
  hash-secret: ${VNPAY_HASH_SECRET:5DJ4Q95ESAEMBAM3H68QBKQ616DHTSZ4}
  payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
  return-url: ${VNPAY_RETURN_URL:http://localhost:5173/driver/payment-return}
  ipn-url: ${VNPAY_IPN_URL:}

# ===== ACTUATOR =====
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ===== SWAGGER =====
springdoc:
  swagger-ui:
    operations-sorter: alpha       # Sắp xếp API theo tên (A-Z)
    tags-sorter: alpha             # Sắp xếp nhóm tag theo tên
    doc-expansion: list            # Mặc định thu gọn, chỉ hiện danh sách

# ===== LOGGING =====
logging:
  level:
    com.smartparking: DEBUG
    org.springframework.security: INFO
    org.springframework.web.socket: INFO

